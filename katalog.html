  <!-- The top bar (same on every page; the text is in copy/tr.toml [common]) -->
  <header class="flex h-16 shrink-0 items-center gap-6 border-b border-overlay bg-panel px-6 md:gap-8 md:px-8">

  <main id="panel" class="mx-auto flex flex-col gap-14 px-6 pt-14 pb-28 md:px-12 lg:gap-20 lg:pt-20 max-w-5xl">
