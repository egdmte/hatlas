<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatlas</title>
  <!-- Same policy as index.html: only our own files plus the OpenFreeMap tiles; MapLibre needs blob: workers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="assets/hatlas-logo.svg">
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <!-- Built by `npm run css` from css/pages.src.css (Tailwind; the playground's look) -->
  <link rel="stylesheet" href="css/pages.css">
  <script src="vendor/maplibre/maplibre-gl.js" defer></script>
  <script src="js/copy.js" defer></script>
  <script src="js/usage.js" defer></script>
  <script src="js/contrib.js" defer></script>
  <script src="js/pages.js" defer></script>
</head>
<!-- data-page tells js/pages.js what to show: city (sehir.html?id=kocaeli), operator, line or stop.
     Desktop: the panel and the map are two rounded surfaces with room around them (the volunteer hub's spacing,
     playground/gonullu-b.html). Phone: the map on top, the panel below it, one scroll. -->
<body class="h-dvh overflow-hidden text-[17px] leading-relaxed" data-page="stop">
  <!-- The top bar (same on every page; the text is in copy/tr.toml [common]) -->
  <header class="flex h-16 shrink-0 items-center gap-6 border-b border-overlay bg-panel px-6 md:gap-8 md:px-8">
    <a href="./" class="shrink-0" aria-label="Hatlas ana sayfası" data-copy-attr="aria-label=common.home_label"><img src="assets/hatlas-logo.svg" width="72" height="24" alt="Hatlas"></a>
    <nav class="flex gap-1 text-[15px] font-medium text-ink-2">
      <a href="./" class="rounded-md px-3 py-2 hover:bg-raised hover:text-ink" data-copy="common.nav_map">Harita</a><a href="katalog.html" class="rounded-md px-3 py-2 hover:bg-raised hover:text-ink hidden sm:inline" data-copy="common.nav_catalog">Veri kataloğu</a><a href="sorunlar.html" class="rounded-md px-3 py-2 hover:bg-raised hover:text-ink hidden sm:inline" data-copy="common.nav_issues">Sorunlar</a>
    </nav>
    <div class="flex-1"></div>
    <a href="katki.html" class="inline-flex h-10 shrink-0 items-center rounded-lg bg-accent px-4 text-[15px] font-semibold text-white hover:bg-accent-hover" data-copy="common.contribute">Katkıda bulun</a>
  </header>

  <main class="flex h-[calc(100dvh-4rem)] flex-col gap-4 overflow-y-auto p-4 md:flex-row md:gap-6 md:overflow-hidden md:p-6">
    <aside id="panel" class="flex w-full shrink-0 flex-col gap-10 rounded-xl bg-panel pb-12 md:w-110 md:overflow-y-auto [scrollbar-color:var(--color-line-strong)_transparent] [scrollbar-width:thin]">
      <p class="mx-6 mt-10 text-ink-3 md:mx-8" data-copy="common.loading">Yükleniyor…</p>
    </aside>
    <section class="order-first h-72 shrink-0 overflow-hidden rounded-xl bg-raised md:order-none md:h-auto md:flex-1" aria-label="Harita" data-copy-attr="aria-label=home.map_label">
      <div id="map" class="h-full w-full"></div>
    </section>
  </main>
</body>
</html>
